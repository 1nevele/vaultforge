name: Claude implement issue

# Lets Claude implement a trusted maintainer's labeled issue and open a PR.
# This grants write access to a privileged job, so it is gated on the actor
# having repository write access (the action's own default check) and runs
# only for the label/mention/assignment triggers configured below. The
# resulting PR still has to pass the separate read-only Claude review
# verification and existing branch protection; this workflow never approves
# or merges anything itself.

on:
  issues:
    types: [labeled, assigned]
  issue_comment:
    types: [created]

jobs:
  implement:
    name: Claude implements the issue
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude-implement') ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'claude') ||
      (github.event_name == 'issue_comment' && github.event.action == 'created' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Run Claude Code to implement the issue
        id: claude
        uses: anthropics/claude-code-action@115e0b2c49222c831de6748ccdf365bb8d3ea9a3
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: '@claude'
          label_trigger: 'claude-implement'
          assignee_trigger: 'claude'
          branch_prefix: 'claude/'
          claude_args: |
            --max-turns 30
          # No separate approval or merge happens here. The opened PR still needs
          # a passing Claude review verification run and human/branch-protection
          # sign-off before merge, per specs/002-vaultforge-claude-automation.
