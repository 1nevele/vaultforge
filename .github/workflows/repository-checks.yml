name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      review_pr:
        description: 'Explicit PR number for the read-only Max review verification (no approval or merge)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-setup:
    name: Workflow setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify pinned workflow assets
        run: python -B -m unittest discover -s tools/tests -v
      - name: Check Bash syntax
        run: |
          for script in .specify/scripts/bash/*.sh; do
            bash -n "$script" || exit
          done
      - name: Verify process-scoped feature context
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/001-sentinel-foundation
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: bash .specify/scripts/bash/check-prerequisites.sh --paths-only --json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            gitleaks.tar.gz | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan reachable history without logging secret values
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: '"$GITLEAKS_BIN" git . --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow'

  claude-review-verification:
    name: Claude review verification
    if: github.event_name == 'workflow_dispatch' && inputs.review_pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    env:
      CLAUDE_WORKING_DIR: ${{ runner.temp }}/claude-review-input
    steps:
      - name: Check out explicitly dispatched controller revision only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare complete inert PR inputs and a fresh review identity
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.review_pr }}
          POLICY_SHA: ${{ github.sha }}
        run: |
          python -B tools/claude_review.py prepare --pr "$PR_NUMBER" --policy-sha "$POLICY_SHA" --directory "$CLAUDE_WORKING_DIR"
          python - <<'PY'
          import json, os, pathlib, shlex
          d = pathlib.Path(os.environ['CLAUDE_WORKING_DIR'])
          schema = json.loads((d / 'schema.json').read_text())
          args = shlex.join(['--model', 'claude-sonnet-4-6', '--max-turns', '4', '--tools', '', '--setting-sources', 'user', '--strict-mcp-config', '--mcp-config', str(d / 'mcp.json'), '--json-schema', json.dumps(schema)])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('claude_args=' + args + '\n')
          PY
      - name: Fresh no-tools Claude review with Max subscription authentication
        id: claude
        uses: anthropics/claude-code-action/base-action@115e0b2c49222c831de6748ccdf365bb8d3ea9a3
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt_file: ${{ env.CLAUDE_WORKING_DIR }}/prompt.txt
          claude_args: ${{ steps.prepare.outputs.claude_args }}
          show_full_output: 'false'
      - name: Independently validate result and recheck current PR identity
        env:
          GH_TOKEN: ${{ github.token }}
          CLAUDE_REVIEW_RESULT: ${{ steps.claude.outputs.structured_output }}
        run: python -B tools/claude_review.py validate --directory "$CLAUDE_WORKING_DIR"
      - name: Preserve validated public review evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-claude-review-${{ github.run_id }}
          path: ${{ env.CLAUDE_WORKING_DIR }}/validated.json
          retention-days: 7
          if-no-files-found: error
