name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-setup:
    name: Workflow setup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify pinned workflow assets
        run: python -B -m unittest discover -s tools/tests -v
      - name: Check Bash syntax
        run: |
          for script in .specify/scripts/bash/*.sh; do
            bash -n "$script" || exit
          done
      - name: Verify process-scoped feature context
        env:
          SPECIFY_FEATURE_DIRECTORY: specs/001-sentinel-foundation
          SPECIFY_FEATURE_NO_PERSIST: '1'
        run: bash .specify/scripts/bash/check-prerequisites.sh --paths-only --json

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            gitleaks.tar.gz | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan reachable history without logging secret values
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks
        run: '"$GITLEAKS_BIN" git . --log-opts=--all --redact=100 --no-banner --ignore-gitleaks-allow'

  sentinel-contracts:
    name: Sentinel contracts (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/sentinel
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - name: Enable Corepack (pinned pnpm from packageManager)
        run: corepack enable
      - name: Install with the committed lockfile
        run: pnpm install --frozen-lockfile
      # Offline unit/setup checks only. These are NOT G0-G8 security or
      # live-integration gates (spec S01-007); they run with no provider
      # credentials, no network targets and no execution surface.
      - name: Typecheck (strict)
        run: pnpm --dir packages/contracts typecheck
      - name: Build
        run: pnpm --dir packages/contracts build
      - name: Test (vitest, offline)
        run: pnpm --dir packages/contracts test
